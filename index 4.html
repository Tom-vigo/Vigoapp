<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123f47"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>VIGO Bau · Demo</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17333a;background:#f2f6f6}*{box-sizing:border-box}body{margin:0}header{background:#123f47;color:white;padding:17px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header strong{font-size:24px;letter-spacing:2px}select,input,textarea,button{font:inherit;padding:10px;border:1px solid #cad7d9;border-radius:9px}button{background:#126d73;color:white;border:0;cursor:pointer}button.secondary{background:#e1eeee;color:#123f47}main{max-width:1100px;margin:auto;padding:22px 16px}nav{display:flex;gap:9px;overflow:auto;margin-bottom:20px}nav button{white-space:nowrap}nav button.active{background:#123f47}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}.card{background:white;border-radius:14px;padding:19px;box-shadow:0 3px 18px #183f4710;margin-bottom:15px}.metric{font-size:25px;font-weight:750;margin:7px 0}.muted{color:#63797d;font-size:14px}.warn{border-left:5px solid #d18c27}.ok{border-left:5px solid #148474}label{display:block;margin:12px 0 5px;font-weight:600}input,textarea,select{max-width:100%;width:100%;background:white}header select{width:auto}textarea{min-height:75px}h1{font-size:24px}h2{font-size:19px}ul{line-height:1.9} .tag{background:#e3f0ed;padding:4px 8px;border-radius:8px;font-size:12px} .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.hidden{display:none}.notice{background:#fff4df;padding:12px;border-radius:10px;margin-bottom:18px;font-size:14px} @media(max-width:600px){header{padding:15px}main{padding:14px}h1{font-size:21px}}</style></head><body><header><strong>VIGO <span style="font-weight:400">BAU</span></strong><div><label for="role" style="display:inline">Ansicht: </label><select id="role"><option value="gf">Geschäftsführer</option><option value="bau">Bauleiter</option><option value="polier">Polier</option><option value="mit">Mitarbeiter</option></select></div></header><main><div class="notice">DEMO · Alle Werte und Namen sind fiktiv. Daten bleiben in diesem Browser auf diesem Gerät. Keine zentrale Synchronisierung.</div><nav id="nav"></nav><div id="screen"></div></main><script>







const COSTKEY='vigo-costs-v13';
let costs={};try{costs=JSON.parse(localStorage.getItem(COSTKEY))||{}}catch(e){}
function costRecord(name){return costs[name]||{budgetLabor:42000,budgetMaterial:25000,budgetMachine:12000,actualMaterial:0,actualMachine:0}}
function setCost(project,field,value){if(!costs[project])costs[project]=costRecord(project);costs[project][field]=Math.max(0,Number(value)||0);localStorage.setItem(COSTKEY,JSON.stringify(costs));render()}
function costPanel(){
 let out='<div class="card"><h2>Nachkalkulation je Baustelle</h2><p class="muted">Demo: Personalkosten = erfasste Stunden × 35 €. Material und Maschinen werden als Ist-Werte eingegeben. Budgets sind fiktive Beispielwerte.</p>';
 for(const pr of data.projects){const c=costRecord(pr.name),labor=hoursEntries.filter(e=>e.project===pr.name).reduce((a,e)=>a+e.hours,0)*35,budget=c.budgetLabor+c.budgetMaterial+c.budgetMachine,actual=labor+c.actualMaterial+c.actualMachine,remaining=budget-actual;
 out+=`<div style="border-top:1px solid #ddd;padding:14px 0"><h3>${esc(pr.name)}</h3><div class="grid"><div><b>Budget Personal (€)</b><input type="number" min="0" value="${c.budgetLabor}" onchange="setCost('${esc(pr.name)}','budgetLabor',this.value)"></div><div><b>Budget Material (€)</b><input type="number" min="0" value="${c.budgetMaterial}" onchange="setCost('${esc(pr.name)}','budgetMaterial',this.value)"></div><div><b>Budget Maschinen (€)</b><input type="number" min="0" value="${c.budgetMachine}" onchange="setCost('${esc(pr.name)}','budgetMachine',this.value)"></div><div><b>Ist Material (€)</b><input type="number" min="0" value="${c.actualMaterial}" onchange="setCost('${esc(pr.name)}','actualMaterial',this.value)"></div><div><b>Ist Maschinen (€)</b><input type="number" min="0" value="${c.actualMachine}" onchange="setCost('${esc(pr.name)}','actualMachine',this.value)"></div></div><p><b>Ist Personal:</b> ${eur(labor)} · <b>Gesamt-Ist:</b> ${eur(actual)} · <b>Gesamtbudget:</b> ${eur(budget)}</p><p style="${remaining<0?'color:#b53b25;font-weight:bold':''}">Budgetrest: ${eur(remaining)} ${remaining<0?'⚠ Budget überschritten':''}</p><p class="muted">Budgetverbrauch: ${budget?Math.round(actual/budget*100)+' %':'kein Budget'}. Ohne leistungsbezogenen Soll-Ist-Vergleich ist das keine belastbare Endkostenprognose.</p></div>`}
 return out+'</div>';
}

const HOURSKEY='vigo-hours-v12';
let hoursEntries=[];try{hoursEntries=JSON.parse(localStorage.getItem(HOURSKEY))||[]}catch(e){}
const PLANNEDKEY='vigo-planned-hours-v12';
let plannedHours={};try{plannedHours=JSON.parse(localStorage.getItem(PLANNEDKEY))||{}}catch(e){}
function hourSummary(){
let h='<div class="card"><h2>Stunden und Projektkosten</h2><p class="muted">Demo-Stundensatz: 35 € je Stunde (reiner Beispielwert). Ist-Stunden entstehen aus gespeicherten Tagesberichten. Keine Lohnabrechnung.</p>';
h+='<div style="overflow:auto"><table style="min-width:620px;width:100%;text-align:left"><thead><tr><th>Projekt</th><th>Soll-Stunden</th><th>Ist-Stunden</th><th>Abweichung</th><th>Ist-Personalkosten</th></tr></thead><tbody>';
for(const pr of data.projects){const actual=hoursEntries.filter(e=>e.project===pr.name).reduce((a,e)=>a+e.hours,0),target=Number(plannedHours[pr.name]??(pr.id===1001?1200:600));h+=`<tr><td>${esc(pr.name)}</td><td><input type="number" min="0" step="1" style="width:85px" value="${target}" onchange="setPlannedHours('${esc(pr.name)}',this.value)"></td><td>${actual.toFixed(1)}</td><td>${(actual-target).toFixed(1)}</td><td>${eur(actual*35)}</td></tr>`}
h+='</tbody></table></div><p class="muted">Soll-Stunden sind Demo-Planwerte; Abweichung ist Ist minus gesamter Sollwert, keine belastbare Fortschrittsabweichung. Für echte Prognosen müssen Soll-Stunden nach Baufortschritt abgegrenzt werden.</p></div>';return h}
function setPlannedHours(project,value){plannedHours[project]=Math.max(0,Number(value)||0);localStorage.setItem(PLANNEDKEY,JSON.stringify(plannedHours));render()}
function hourForm(){return `<div class="card"><h2>Arbeitsstunden im Tagesbericht</h2><form id="hour-form"><label>Projekt</label><select name="project">${data.projects.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select><label>Mitarbeiter</label><select name="person">${staffing.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><label>Arbeitstag</label><input type="date" name="date" value="${isoDate(new Date())}" required><label>Geleistete Stunden</label><input type="number" name="hours" min="0.25" max="24" step="0.25" value="8" required><button>Stunden lokal erfassen</button></form><h3>Letzte Einträge</h3>${hoursEntries.slice(-5).reverse().map(e=>`<p>${esc(e.date)} · ${esc(e.project)} · ${esc(staffing.people.find(p=>p.id===e.person)?.name||'Mitarbeiter')} · ${e.hours} Std.</p>`).join('')||'<p class="muted">Noch keine Stunden erfasst.</p>'}</div>`}
function bindHours(){const f=document.querySelector('#hour-form');if(!f)return;f.onsubmit=e=>{e.preventDefault();const v=new FormData(f),hours=Number(v.get('hours'));if(!(hours>0&&hours<=24))return;hoursEntries.push({project:v.get('project'),person:Number(v.get('person')),date:v.get('date'),hours});localStorage.setItem(HOURSKEY,JSON.stringify(hoursEntries));render()}}

const QUALKEY='vigo-site-qual-v11';
let qualifications={};try{qualifications=JSON.parse(localStorage.getItem(QUALKEY))||{}}catch(e){}
function requiredSkill(site){return qualifications[site]||trades[sites.indexOf(site)%trades.length]}
function qualificationPanel(){
const dates=Array.from({length:5},(_,i)=>{let d=weekMonday(weekOffset);d.setDate(d.getDate()+i);return isoDate(d)});
let out='<div class="card"><h2>Qualifikationsbedarf der Baustellen</h2><p class="muted">Pro Baustelle ist in der Demo eine erforderliche Kernqualifikation hinterlegt. Weitere Anforderungen und Nachweise folgen später.</p>';
out+=sites.map(site=>`<div class="row" style="padding:7px;border-bottom:1px solid #e5eeee"><b>${esc(site)}</b><select aria-label="Qualifikation ${esc(site)}" style="width:auto" onchange="setSiteSkill('${esc(site)}',this.value)">${trades.map(skill=>`<option ${requiredSkill(site)===skill?'selected':''}>${esc(skill)}</option>`).join('')}</select></div>`).join('')+'</div>';
out+='<div class="card"><h2>VIGO · Qualifizierte Einsatzempfehlungen</h2><p class="muted">Nur Mitarbeiter mit passender Kernqualifikation, ohne Abwesenheit und mit rechnerischer Überdeckung ihrer bisherigen Baustelle werden vorgeschlagen. Kein automatischer Personalwechsel.</p>';
let count=0;
for(const date of dates)for(const site of sites){
 const need=Number(needs[site+'|'+date]??(site===sites[0]?6:3));
 const assigned=staffing.people.filter(x=>x.available&&!absenceOn(x.id,date)&&effectiveSite(x,date)===site);
 const suitable=assigned.filter(x=>x.skill===requiredSkill(site)).length;
 const deficit=Math.max(0,need-assigned.length);
 const qualifiedMissing=Math.max(0,Math.min(need,assigned.length)-suitable);
 if(!deficit&&!qualifiedMissing)continue;
 count++;
 const candidates=staffing.people.filter(x=>{
  if(!x.available||absenceOn(x.id,date)||effectiveSite(x,date)===site||x.skill!==requiredSkill(site))return false;
  const origin=effectiveSite(x,date);
  const originCount=staffing.people.filter(y=>y.available&&!absenceOn(y.id,date)&&effectiveSite(y,date)===origin).length;
  return originCount>Number(needs[origin+'|'+date]??(origin===sites[0]?6:3));
 });
 out+=`<p><b>${esc(site)} · ${date}</b><br>Bedarf: ${need}; eingeplant: ${assigned.length}; davon passende Kernqualifikation: ${suitable}. ${deficit?'Personelle Unterdeckung: '+deficit+'. ':''}${qualifiedMissing?'Qualifikationslücke: '+qualifiedMissing+'. ':''}<br>${candidates.length?'Prüfkandidaten: '+candidates.slice(0,Math.max(deficit,qualifiedMissing)).map(x=>esc(x.name)+' ('+esc(effectiveSite(x,date))+')').join(', '):'Keine rechnerisch freien Mitarbeiter mit passender Kernqualifikation gefunden.'}</p>`;
}
return out+(count?'':'<p>Keine rechnerischen Engpässe oder Qualifikationslücken in dieser Woche.</p>')+'<p class="muted">Hinweis: Wohnort, Fahrzeit, Teamstabilität und Zertifikate sind noch nicht validiert. Der Bauleiter prüft und entscheidet.</p></div>';
}
function setSiteSkill(site,skill){if(role()!=='bau'||!sites.includes(site)||!trades.includes(skill))return;qualifications[site]=skill;localStorage.setItem(QUALKEY,JSON.stringify(qualifications));render()}

const ASSIGNKEY='vigo-day-assign-v10';
let dayAssignments={};try{dayAssignments=JSON.parse(localStorage.getItem(ASSIGNKEY))||{}}catch(e){}
function effectiveSite(person,date){return dayAssignments[person.id+'|'+date]||person.site}
function calendarBoard(){
 const dates=Array.from({length:5},(_,i)=>{const d=weekMonday(weekOffset);d.setDate(d.getDate()+i);return isoDate(d)});
 let h='<div class="card"><h2>Grafischer Wochenkalender</h2><p class="muted">Bauleiter: Mitarbeiter per Auswahl für einzelne Tage umplanen. Auf Touch-Geräten ohne Drag-and-drop bedienbar.</p><div style="overflow:auto"><table style="min-width:760px;width:100%;border-collapse:collapse;text-align:left"><thead><tr><th>Mitarbeiter</th>'+dates.map(d=>`<th>${d.slice(5)}</th>`).join('')+'</tr></thead><tbody>';
 for(const person of staffing.people){h+=`<tr><td style="padding:6px;border-bottom:1px solid #ddd">${esc(person.name)}<br><small>${esc(person.skill)}</small></td>`;for(const date of dates){const absence=absenceOn(person.id,date),available=person.available&&!absence,site=effectiveSite(person,date);h+=`<td style="padding:4px;border-bottom:1px solid #ddd;${!available?'background:#fff0dc':''}">${available?`<select aria-label="${esc(person.name)} ${date}" style="min-width:120px;padding:6px" onchange="setDayAssignment(${person.id},'${date}',this.value)">${sites.map(x=>`<option value="${esc(x)}" ${site===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:`<span>${absence?esc(absence.type):'Abwesend'}</span>`}</td>`}h+='</tr>'}
 h+='</tbody></table></div><p class="muted">Änderungen werden auf diesem Gerät gespeichert. Keine automatische Übertragung an Mitarbeiter.</p></div>';
 h+='<div class="card"><h2>Tagesbilanz nach Einsatzplanung</h2><div style="overflow:auto"><table style="min-width:650px;width:100%;text-align:left"><thead><tr><th>Baustelle</th>'+dates.map(d=>`<th>${d.slice(5)}</th>`).join('')+'</tr></thead><tbody>';
 for(const site of sites){h+=`<tr><td>${esc(site)}</td>`;for(const date of dates){const actual=staffing.people.filter(x=>x.available&&!absenceOn(x.id,date)&&effectiveSite(x,date)===site).length,required=Number(needs[site+'|'+date]??(site===sites[0]?6:3));h+=`<td style="${actual<required?'background:#fff0dc':''}">${actual}/${required} ${actual<required?'⚠':''}</td>`}h+='</tr>'}h+='</tbody></table></div><p class="muted">Format: eingeplante verfügbare Mitarbeiter / Soll-Bedarf. Keine Prüfung von Fahrtzeiten oder Qualifikationsbedarf.</p></div>';
 return h;
}
function setDayAssignment(id,date,site){if(role()!=='bau')return;const p=staffing.people.find(x=>x.id===id);if(!p||!p.available||absenceOn(id,date)||!sites.includes(site))return;dayAssignments[id+'|'+date]=site;localStorage.setItem(ASSIGNKEY,JSON.stringify(dayAssignments));render()}

const NEEDKEY='vigo-daily-needs-v09';
let needs={};try{needs=JSON.parse(localStorage.getItem(NEEDKEY))||{}}catch(e){}
function dailyCapacity(){
 const dates=Array.from({length:5},(_,i)=>{const d=weekMonday(weekOffset);d.setDate(d.getDate()+i);return isoDate(d)});
 const selected=staffing.people.filter(p=>p.site===sites[0]);
 let out='<div class="card"><h2>Tagesgenaue Kapazität und Personalbedarf</h2><p class="muted">Bedarf je Baustelle und Tag editierbar. Einsätze gelten in der Demo für die gesamte Woche; Abwesenheiten werden je Datum geprüft.</p><div style="overflow:auto"><table style="min-width:680px;width:100%;text-align:left"><thead><tr><th>Baustelle</th>'+dates.map(d=>`<th>${d.slice(5)}</th>`).join('')+'</tr></thead><tbody>';
 for(const site of sites){out+=`<tr><td>${esc(site)}</td>`;for(const date of dates){const key=site+'|'+date, required=Number(needs[key]??(site===sites[0]?6:3)),actual=staffing.people.filter(p=>effectiveSite(p,date)===site&&p.available&&!absenceOn(p.id,date)).length, gap=Math.max(0,required-actual);out+=`<td style="padding:5px;${gap?'background:#fff0dc':''}"><small>${actual} verfügbar</small><br><input aria-label="Personalbedarf ${esc(site)} ${date}" type="number" min="0" max="99" style="width:68px" value="${required}" onchange="setNeed('${esc(site)}','${date}',this.value)"><br><small>${gap?'Fehlen: '+gap:'Gedeckt'}</small></td>`}out+='</tr>'}
 out+='</tbody></table></div></div>';
 out+='<div class="card"><h2>VIGO · Personalvorschläge</h2><p class="muted">Vorschläge basieren auf tagesgenauer Verfügbarkeit, bestehender Zuordnung und Qualifikation. Fahrzeiten, tatsächlicher Qualifikationsbedarf und Teamstabilität müssen vom Bauleiter geprüft werden.</p>';
 let found=0;
 for(const date of dates)for(const site of sites){const required=Number(needs[site+'|'+date]??(site===sites[0]?6:3)), assigned=staffing.people.filter(p=>effectiveSite(p,date)===site&&p.available&&!absenceOn(p.id,date));let gap=required-assigned.length;if(gap<=0)continue;found++;const candidates=staffing.people.filter(p=>p.site!==site&&p.available&&!absenceOn(p.id,date)).sort((a,b)=>{const ac=staffing.people.filter(x=>x.site===a.site&&x.available&&!absenceOn(x.id,date)).length;const bc=staffing.people.filter(x=>x.site===b.site&&x.available&&!absenceOn(x.id,date)).length;const an=Number(needs[a.site+'|'+date]??(a.site===sites[0]?6:3)),bn=Number(needs[b.site+'|'+date]??(b.site===sites[0]?6:3));return (bc-bn)-(ac-an)}).filter(p=>staffing.people.filter(x=>x.site===p.site&&x.available&&!absenceOn(x.id,date)).length>Number(needs[p.site+'|'+date]??(p.site===sites[0]?6:3)));
 out+=`<p><b>${esc(site)} · ${date}:</b> ${gap} Mitarbeiter fehlen.<br>${candidates.length?'Mögliche Prüfung: '+candidates.slice(0,gap).map(p=>esc(p.name)+' ('+esc(p.skill)+', derzeit '+esc(p.site)+')').join('; '):'Keine Mitarbeiter mit freier Kapazität auf anderen Baustellen gefunden.'}</p>`}
 out+=(found?'':'<p>In dieser Woche sind alle eingetragenen Bedarfe gedeckt.</p>')+'<p class="muted">Keine automatische Umbuchung: Der Bauleiter entscheidet über jede Änderung. Die Planung ist eine Demo und keine belastbare Einsatzoptimierung.</p></div>';
 return out;
}
function setNeed(site,date,value){needs[site+'|'+date]=Math.max(0,Math.min(99,Number(value)||0));localStorage.setItem(NEEDKEY,JSON.stringify(needs));render()}

const ABSKEY='vigo-absences-v08';
let absences=[];try{absences=JSON.parse(localStorage.getItem(ABSKEY))||[]}catch(e){}
const isoDate=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const dayStart=s=>new Date(s+'T12:00:00');
function weekMonday(offset=0){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7+offset*7);return d}
let weekOffset=0;
function absenceOn(id,date){return absences.find(a=>a.id===id&&a.from<=date&&a.to>=date)}
function weekPanel(){
const mon=weekMonday(weekOffset), days=Array.from({length:5},(_,i)=>{let d=new Date(mon);d.setDate(mon.getDate()+i);return isoDate(d)});
let out=`<div class="card"><div class="row"><h2>Wochenübersicht · ${days[0]} bis ${days[4]}</h2><div><button class="secondary" onclick="weekOffset--;render()">←</button> <button class="secondary" onclick="weekOffset=0;render()">Heute</button> <button class="secondary" onclick="weekOffset++;render()">→</button></div></div><p class="muted">Einsatzzuordnung gilt in dieser Demo für alle Wochentage; Urlaub und Krankheit werden tageweise berücksichtigt.</p><div style="overflow:auto"><table style="border-collapse:collapse;min-width:650px;width:100%;text-align:left"><thead><tr><th>Mitarbeiter</th>${days.map(d=>`<th>${d.slice(5)}</th>`).join('')}</tr></thead><tbody>`;
for(const person of staffing.people){out+=`<tr><td style="padding:7px;border-bottom:1px solid #ddd">${esc(person.name)}</td>`;for(const d of days){const a=absenceOn(person.id,d),label=a?(a.type==='Krank'?'Krank':'Urlaub'):(!person.available?'Abwesend':person.site);out+=`<td style="padding:7px;border-bottom:1px solid #ddd;${a?'background:#fff0dc':''}">${esc(label)}</td>`}out+='</tr>'}out+='</tbody></table></div></div>';
const absent=staffing.people.filter(person=>days.some(d=>absenceOn(person.id,d)||!person.available)).length;
out+=`<div class="card"><h2>Kapazitäts-Hinweis</h2><p><b>${absent} von ${staffing.people.length}</b> Mitarbeitern sind in der angezeigten Arbeitswoche an mindestens einem Tag abwesend oder generell nicht verfügbar.</p><p class="muted">Ein Baustellenengpass kann erst mit tagesgenauem Soll-Personalbedarf sicher berechnet werden.</p></div>`;
out+=`<div class="card"><h2>Urlaub oder Krankheit eintragen</h2><form id="absence-form"><label>Mitarbeiter</label><select name="person">${staffing.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><label>Abwesenheitsart</label><select name="type"><option value="Urlaub">Urlaub</option><option value="Krank">Krank</option></select><label>Von</label><input name="from" type="date" value="${days[0]}" required><label>Bis</label><input name="to" type="date" value="${days[4]}" required><p><button>Abwesenheit speichern</button></p></form><h3>Erfasste Abwesenheiten</h3>${absences.length?absences.map((a,i)=>`<p>${esc(staffing.people.find(p=>p.id===a.id)?.name||'Mitarbeiter')} · ${esc(a.type)} · ${a.from} bis ${a.to} <button class="secondary" onclick="absences.splice(${i},1);localStorage.setItem(ABSKEY,JSON.stringify(absences));render()">Entfernen</button></p>`).join(''):'<p class="muted">Keine Abwesenheiten erfasst.</p>'}</div>`;
return out;
}
function bindAbsenceForm(){const form=document.querySelector('#absence-form');if(form)form.onsubmit=e=>{e.preventDefault();const v=new FormData(form),from=v.get('from'),to=v.get('to');if(from>to){alert('Enddatum muss am oder nach dem Startdatum liegen.');return}absences.push({id:Number(v.get('person')),type:v.get('type'),from,to});localStorage.setItem(ABSKEY,JSON.stringify(absences));render()}}

const SKEY='vigo-staff-v07';
const sites=['Bahnhof Kaufbeuren','Straßenbau Memmingen','Gewerbepark Süd','Kanalbau Mindelheim','Ortsdurchfahrt Ottobeuren','Erschließung Kempten','Brückensanierung Buchloe','Radweg Bad Grönenbach'];
const trades=['Tiefbau','Pflasterbau','Maschinenführung','Vermessung','Rohrleitungsbau'];
let staffing;
try{staffing=JSON.parse(localStorage.getItem(SKEY))}catch(e){}
if(!staffing||!Array.isArray(staffing.people)){staffing={people:Array.from({length:30},(_,i)=>({id:i+1,name:'Demo-Mitarbeiter '+String(i+1).padStart(2,'0'),skill:trades[i%trades.length],site:sites[i%sites.length],available:i%11!==0,home:['Memmingen','Kaufbeuren','Kempten','Mindelheim'][i%4]})),history:[]}}
function staffsave(){localStorage.setItem(SKEY,JSON.stringify(staffing))}
function planner(){
const siteCount=Object.fromEntries(sites.map(s=>[s,staffing.people.filter(p=>p.site===s).length]));
let page='<h1>Personal- und Kapazitätsplanung</h1><div class="notice">Demo mit 30 fiktiven Mitarbeitern und 8 Baustellen. Der Bauleiter entscheidet; VIGO macht nur Vorschläge. Fahrzeiten werden noch nicht aus Straßenentfernungen berechnet.</div>';
page+='<div class="grid">'+sites.map(s=>`<div class="card"><b>${esc(s)}</b><div class="metric">${siteCount[s]} MA</div><span class="muted">Geplant</span></div>`).join('')+'</div>';
page+='<div class="card"><h2>Einsatzplanung durch Bauleiter</h2><label>Mitarbeiter</label><select id="staff-person">'+staffing.people.map(p=>`<option value="${p.id}">${esc(p.name)} · ${esc(p.skill)} · ${p.available?'verfügbar':'abwesend'}</option>`).join('')+'</select><label>Zielbaustelle</label><select id="staff-target">'+sites.map(s=>`<option>${esc(s)}</option>`).join('')+'</select><p><button onclick="assignStaff()">Einsatz durch Bauleiter festlegen</button></p><p id="staff-message" class="muted"></p></div>';
page+='<div class="card"><h2>VIGO-Vorschläge bei BUG-Verschiebung</h2>'+ (data.delay?`<p>Sechs betroffene Mitarbeiter prüfen. Mögliche Zielbaustellen: Memmingen und Gewerbepark Süd. VIGO berücksichtigt hier Qualifikation und Verfügbarkeit; Fahrzeit und Personalbedarf sind noch nicht validiert.</p><button onclick="suggestStaff()">Vorschläge berechnen</button><div id="suggestions"></div>`:'<p>Aktiviere unter „Umplanung“ den BUG-Testfall, um konkrete Personalvorschläge zu sehen.</p>')+'</div>';
page+='<div class="card"><h2>Mitarbeiterübersicht</h2><div style="overflow:auto"><table style="width:100%;border-collapse:collapse;text-align:left"><thead><tr><th>Name</th><th>Qualifikation</th><th>Wohnort</th><th>Baustelle</th><th>Status</th></tr></thead><tbody>'+staffing.people.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.skill)}</td><td>${esc(p.home)}</td><td>${esc(p.site)}</td><td>${p.available?'Verfügbar':'Abwesend'}</td></tr>`).join('')+'</tbody></table></div></div>';
return page+calendarBoard()+qualificationPanel()+weekPanel()+dailyCapacity();
}
function assignStaff(){if(role()!=='bau'){alert('Nur in der Bauleiter-Ansicht möglich.');return}const p=staffing.people.find(p=>p.id===Number(document.querySelector('#staff-person').value));const target=document.querySelector('#staff-target').value;if(!p.available){document.querySelector('#staff-message').textContent='Nicht möglich: Mitarbeiter ist als abwesend markiert.';return}const old=p.site;p.site=target;staffing.history.push({id:p.id,old,target,at:new Date().toISOString()});staffsave();render()}
function suggestStaff(){const affected=staffing.people.filter(p=>p.site==='Bahnhof Kaufbeuren').slice(0,6);document.querySelector('#suggestions').innerHTML='<h3>Unverbindliche Prüfliste</h3>'+affected.map((p,i)=>`<p>${esc(p.name)} (${esc(p.skill)}): ${p.available?'möglicher Einsatz':'abwesend – nicht einplanen'} · Vorschlag: ${esc(i%2?'Gewerbepark Süd':'Straßenbau Memmingen')} · Qualifikationsbedarf und Fahrzeit prüfen</p>`).join('')+'<p class="muted">Keine automatische Umbuchung. Bauleiter muss jeden Einsatz prüfen und freigeben.</p>'}

const KEY='vigo-demo-v1';const seed={projects:[{id:1001,name:'Bahnhof Kaufbeuren',client:'BUG',value:240000,progress:65,staff:6,status:'Im Plan'},{id:1002,name:'Straßenbau Memmingen',client:'Stadt Memmingen',value:180000,progress:35,staff:4,status:'Im Plan'},{id:1003,name:'Gewerbepark Süd',client:'Beispiel GmbH',value:125000,progress:20,staff:3,status:'Im Plan'}],reports:[],delay:false};let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){data=structuredClone(seed)}let tab='start';const $=s=>document.querySelector(s);const eur=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function cases(){let out=[];if(data.delay)out.push({project:'Bahnhof Kaufbeuren',reason:'BUG: Auftrag um 3 Monate verschoben',staff:6,value:240000,months:3});for(const r of data.reports){if(r.type==='Verzögerung'||r.type==='Mitarbeiter fehlt'||r.type==='Material fehlt'){const p=data.projects.find(x=>x.name===r.project);if(p)out.push({project:p.name,reason:r.type+': '+r.note,staff:r.type==='Mitarbeiter fehlt'?1:p.staff,value:p.value,months:null})}}return out}
function scenario(c){return `<div class="card warn"><h2>${esc(c.project)} – Prüfung erforderlich</h2><p>${esc(c.reason)}</p><p><b>${c.staff} Mitarbeiter</b> potenziell betroffen · <b>${eur(c.value)}</b> Auftragswert des Projekts. ${c.months?'Zeitliche Verschiebung: '+c.months+' Monate.':''}</p><p class="muted">Das Auftragsvolumen ist kein berechneter Umsatzverlust. Belastbare Auswirkungen auf Umsatz, Liquidität und Ergebnis erfordern Leistungsplan, Kosten und Zahlungstermine.</p><h2>Unverbindlicher Vorschlag für den Bauleiter</h2><ul><li>Verfügbarkeit, Qualifikation, Wohnort/Fahrzeit und bestehende Teams prüfen.</li><li>Freie Kapazität auf anderen Baustellen und möglichen früheren Beginn prüfen.</li><li>Falls erforderlich Kundenanfrage zum früheren Start vorbereiten.</li><li>Nach Prüfung Entscheidung und geänderte Termine dokumentieren.</li></ul><button onclick="alert('Demo: Vorschlag zur Prüfung durch den Bauleiter. Keine automatische Umbuchung oder Benachrichtigung.')">Prüfung durch Bauleiter</button></div>`}function role(){return $('#role').value}function tabs(){return role()==='gf'?['start','projekte','planung','berichte']:role()==='bau'?['start','projekte','planung','personal','berichte']:role()==='polier'?['start','berichte','projekte']:['start','berichte']}function render(){if(!tabs().includes(tab))tab='start';$('#nav').innerHTML=tabs().map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${{start:'Übersicht',projekte:'Projekte',planung:'Umplanung',personal:'Personal',berichte:'VIGO-App · Meldungen'}[t]}</button>`).join('');let html='';if(tab==='start'){html='<h1>'+({gf:'Geschäftsführer-Dashboard',bau:'Bauleiter-Übersicht',polier:'Meine Baustelle',mit:'Mein Arbeitstag'}[role()])+'</h1>';if(role()==='gf'||role()==='bau'){html+=`<div class="grid"><div class="card"><div class="muted">Aktive Projekte</div><div class="metric">${data.projects.length}</div></div><div class="card"><div class="muted">Auftragsvolumen (Demo)</div><div class="metric">${eur(data.projects.reduce((a,p)=>a+p.value,0))}</div></div><div class="card"><div class="muted">Offene Meldungen</div><div class="metric">${data.reports.length}</div></div><div class="card"><div class="muted">BUG-Verschiebung</div><div class="metric">${data.delay?'3 Monate':'Keine'}</div></div></div>`;if(cases().length)html+=`<div class="card warn"><h2>Handlungsbedarf: ${cases().length} mögliche Umplanung(en)</h2><p>Baustellenmeldungen und BUG-Testfall werden gemeinsam ausgewertet.</p><button onclick="tab='planung';render()">Auswirkungen prüfen</button></div>`;html+='<div class="card"><h2>Letzte Baustellenmeldungen</h2>'+ (data.reports.length?data.reports.slice(-3).reverse().map(r=>`<p><b>${esc(r.project)}</b> · ${esc(r.type)}: ${esc(r.note)}</p>`).join(''):'<p class="muted">Noch keine Meldungen vorhanden.</p>')+'</div>'}else html+='<div class="card"><p>Erfasse eine Meldung oder einen Tagesbericht für deine Baustelle.</p><button onclick="tab=\'berichte\';render()">Meldung erfassen</button></div>'}if(tab==='personal'){html=planner()+hourSummary()}if(tab==='projekte'){html='<h1>Projektverwaltung</h1>'+data.projects.map(p=>`<div class="card"><div class="row"><h2>${esc(p.name)}</h2><span class="tag">${esc(p.status)}</span></div><p class="muted">${esc(p.client)} · Projekt ${p.id}</p><p>Auftragswert: <b>${eur(p.value)}</b> · Fortschritt: ${p.progress}% · Geplante Mitarbeiter: ${p.staff}</p><progress value="${p.progress}" max="100" style="width:100%"></progress></div>`).join('');if(role()==='gf'||role()==='bau')html+=`<div class="card"><h2>Neues Projekt</h2><form id="newproject"><label>Projektname</label><input name="name" required><label>Kunde</label><input name="client" required><label>Auftragswert (€)</label><input name="value" type="number" min="0" required><button>Projekt anlegen</button></form></div>`}if(tab==='planung'){html=`<h1>Umplanung · BUG-Testfall</h1><div class="card"><p>Simuliere eine Verschiebung des Projekts „Bahnhof Kaufbeuren“ um drei Monate.</p><button onclick="data.delay=!data.delay;save();render()">${data.delay?'Verschiebung zurücknehmen':'BUG-Verschiebung simulieren'}</button></div>` + (cases().length?cases().map(scenario).join(''):'<div class="card ok">Keine offenen Umplanungsfälle aus Meldungen oder Simulation.</div>')}if(tab==='berichte'){html=`<h1>VIGO-App · Baustellenmeldung</h1><div class="card"><form id="report"><label>Baustelle</label><select name="project">${data.projects.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select><label>Art der Meldung</label><select name="type"><option>Baustellenfortschritt</option><option>Material fehlt</option><option>Mitarbeiter fehlt</option><option>Verzögerung</option><option>Zusatzleistung / Nachtrag</option></select><label>Beschreibung</label><textarea name="note" required placeholder="Was ist passiert?"></textarea><label>Foto (nur Vorschau; wird nicht gespeichert)</label><input type="file" accept="image/*" capture="environment"><button>Meldung lokal speichern</button></form></div><div class="card"><h2>Gespeicherte Meldungen</h2>${data.reports.length?data.reports.slice().reverse().map(r=>`<p><b>${esc(r.project)}</b> · ${esc(r.type)}<br>${esc(r.note)}<br><small class="muted">${esc(r.date)}</small></p>`).join(''):'<p class="muted">Noch keine Meldungen.</p>'}</div>`}if(tab==='berichte')html+=hourForm();if(tab==='start'&&(role()==='gf'||role()==='bau'))html+=hourSummary()+costPanel();$('#screen').innerHTML=html;bindHours();const f=$('#report');if(f)f.onsubmit=e=>{e.preventDefault();const v=new FormData(f);data.reports.push({project:v.get('project'),type:v.get('type'),note:v.get('note'),date:new Date().toLocaleString('de-DE')});save();render()};bindAbsenceForm();const np=$('#newproject');if(np)np.onsubmit=e=>{e.preventDefault();const v=new FormData(np);data.projects.push({id:Math.max(...data.projects.map(p=>p.id))+1,name:v.get('name'),client:v.get('client'),value:Number(v.get('value')),progress:0,staff:0,status:'Anfrage'});save();render()}}$('#role').addEventListener('change',render);render();
</script><script>
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
 navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Offline-Installation nicht verfügbar:',e));
}
</script></body></html>
